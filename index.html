<!DOCTYPE html>
<html>
  <head>
    <title>Clima Hoje</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app-container">
      <div class="left-column">
        <nav class="navbar-container">
          <img src="./images/logo.svg" alt="Clima Hoje" />
          <input
            class="custom-input"
            type="text"
            name="city"
            id="city"
            placeholder="Procure por cidades"
          />
        </nav>

        <div class="showcase-container">
          <div class="showcase-text">
            <h2>São Paulo</h2>
            <p>Chance de chuva 0%</p>
            <h2>28°</h2>
          </div>
          <img src="./images/sunClouds.svg" alt="Sol com poucas nuvens" />
        </div>

        <div class="hourly-forecast-container">
          <div class="hour-weather-item">
            <p class="hour">6:00 AM</p>
            <img src="./images/sun-cloud.svg" alt="" />
            <p class="temperature">24º</p>
          </div>

          <div class="hour-weather-item">
            <p class="hour">9:00 AM</p>
            <img src="./images/sun-clouds.svg" alt="Sol com nuvens" />
            <p class="temperature">28º</p>
          </div>

          <div class="hour-weather-item">
            <p class="hour">12:00 PM</p>
            <img src="./images/sun.svg" alt="Sol" />
            <p class="temperature">30º</p>
          </div>

          <div class="hour-weather-item">
            <p class="hour">3:00 PM</p>
            <img src="./images/sun.svg" alt="Sol" />
            <p class="temperature">32º</p>
          </div>

          <div class="hour-weather-item">
            <p class="hour">6:00 PM</p>
            <img src="./images/clouds.svg" alt=""Nublado />
            <p class="temperature">27º</p>
          </div>

          <div class="hour-weather-item">
            <p class="hour">9:00 PM</p>
            <img src="./images/moon-clouds.svg" alt="Noite com nuvens" />
            <p class="temperature">26º</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
